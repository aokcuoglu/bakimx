services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bakimx
      POSTGRES_PASSWORD: bakimx
      POSTGRES_DB: bakimx
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakimx"]
      interval: 5s
      timeout: 5s
      retries: 5

# Media/storage artık AWS S3 (bakimx-media-dev) — yerel MinIO kaldırıldı (2026-07-20).
# Bu compose yalnızca hibrit migration atölyesi DB'si içindir (bkz. scripts/db-migrate-local.sh).

volumes:
  pgdata_local: