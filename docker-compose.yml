services:
  app:
    image: ghcr.io/aokcuoglu/app:latest
    restart: unless-stopped
    env_file: .env.production
    # Cap memory so a bakimx spike can't OOM-starve the co-hosted getirbakim stack.
    # Compose v2 enforces this on `docker compose up`. 2g leaves headroom for
    # sharp/heic-convert image processing on photo uploads — load-test before lowering.
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bayat-chunk kurtarması (Katman 2): static asset'leri deploy'lar arası biriktir.
      # Entrypoint her build'in chunk'larını buraya kopyalar; eski deploy'ların chunk'ları
      # diskte kaldığı için cache'li istemciler 404 almaz. Bkz. docker-entrypoint.sh.
      - next-static:/app/.next/static
    networks:
      internal:
      # Stable alias on the shared neutral edge network so the edge nginx can
      # target `bakimx-app:3000` without colliding with other stacks' `app`.
      proxy:
        aliases:
          - bakimx-app

  # One-shot DB migration. Run BEFORE recreating `app` at deploy time:
  #   docker compose run --rm migrate
  # `tools` profile keeps it out of `docker compose up`. Idempotent (migrate deploy
  # applies only pending migrations). Uses the same image:tag as `app`.
  migrate:
    image: ghcr.io/aokcuoglu/app:latest
    profiles: ["tools"]
    restart: "no"
    env_file: .env.production
    working_dir: /migrate
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bakimx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-bakimx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bakimx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  pgdata:
  next-static:

networks:
  internal:
  # Shared neutral edge network, owned by the standalone `edge` unit (see the
  # edge/ repo/dir on the VPS) — NOT by getirbakim. Created out of band:
  # `docker network create edge`. The edge nginx proxies to `bakimx-app:3000`.
  proxy:
    external: true
    name: edge