name: Deploy to AWS prod (bakimx.com / app.bakimx.com)

# AWS-hosted production (bakimx.com + app.bakimx.com), separate AWS account
# (075550799591) from dev (292398627626). Mirrors deploy-dev-aws.yml. Infra is
# CDK-managed (bakimx-prod-* stacks); IAM/OIDC + task-def env: docs/deployment/aws-prod.md.
#
# Flow: build arm64 image → push to ECR → register a new task-def revision (image
# swap + runtime env inject) → DB migration gate (one-off ECS task, aborts on
# failure) → update the ECS service.
#
# TRIGGER: every push to `main` (i.e. every dev→main PR merge) plus manual dispatch.
# Enabled 2026-07-26, after the DNS cutover (2026-07-21) proved stable. Until then this
# was dispatch-only, which meant a merge to `main` shipped nothing until someone
# remembered to press the button — the failure mode this trigger removes.
#
# This is the only prod deploy path. The old Contabo VPS workflow (deploy.yml) was
# deleted in 2026-07 — BakımX no longer runs on that host and will not return to it.
# Rollback is an ECS task-def revert (see docs/releasing.md), not a DNS flip.
#
# paths-ignore keeps docs/release-note-only commits from burning an 11-minute deploy.
# NOTE: a version bump touches package.json, so release commits DO deploy — intended.

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/deploy-prod-aws.yml"
      - ".github/workflows/stage2a-diagnostic.yml"
      - "**.md"
      - "docs/**"
      - ".env*.example"
  workflow_dispatch:

# OIDC: assume the AWS deploy role without long-lived keys.
permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-prod-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 075550799591.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: bakimx/app
  ECS_CLUSTER: bakimx-prod-cluster
  ECS_SERVICE: bakimx-prod-app-svc
  TASK_FAMILY: bakimx-prod-app
  CONTAINER_NAME: app
  ROLE_ARN: arn:aws:iam::075550799591:role/bakimx-prod-gha-deploy

jobs:
  # PR-origin gate — a commit that never went through a pull request must not ship to
  # production. Written when `main` was unprotected and a direct push both landed AND
  # auto-deployed — that happened on 2026-07-30 (3079291, 3f038e7, two unreviewed prod
  # deploys). Since 2026-08-17 (BAK-89) `main` requires a PR and admins cannot bypass,
  # so this is now defence in depth rather than the only gate: it still stops a commit
  # that reached main while protection was temporarily off from being SHIPPED.
  # main-push-guard.yml raises the alarm; this is the gate. Approved by alpkaan on
  # 2026-08-15 (BAK-59). See docs/agent-workflows/repo-guardrails.md §2.
  #
  # The `if` is on the STEP, not the job: a job-level `if` would mark this job
  # `skipped` on workflow_dispatch, and `deploy` — which needs it — would be skipped
  # with it. Here the job just runs zero steps and goes green in seconds.
  # That is the deliberate hotfix escape hatch: an approved direct push can still be
  # shipped by hand (Actions → this workflow → Run workflow), which leaves a trail
  # (who dispatched it) while main-push-guard.yml still fails and files its issue.
  pr-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Did this commit come from a pull request?
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null) | .number] | first // empty')
          if [ -z "$PR" ]; then
            echo "::error::${GITHUB_SHA} PR'sız main'e girdi — prod deploy durduruldu. Bilinçli bir hotfix ise: Actions → Deploy to AWS prod → Run workflow."
            exit 1
          fi
          echo "Commit came from PR #${PR} — proceeding."

  # Quality gate — same rationale as deploy-dev-aws.yml, and it matters more here:
  # this workflow ships to production on a bare `push` to main. Without this job a
  # direct commit to main deployed with zero validation.
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: [pr-origin, quality]
    # Native ARM64 runner → Fargate task runtimePlatform is ARM64 (Graviton), so the image
    # must be arm64. Native build avoids QEMU emulation. If arm64 hosted runners are not
    # available on your GitHub plan, switch to `ubuntu-latest` and add
    # `docker/setup-qemu-action@v3` (build-push-action already targets platforms: linux/arm64).
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate analytics build configuration
        env:
          ANALYTICS_ENABLED: ${{ vars.PROD_NEXT_PUBLIC_ANALYTICS_ENABLED }}
          GA_MEASUREMENT_ID: ${{ vars.PROD_NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          if [ "$ANALYTICS_ENABLED" != "true" ]; then
            echo "::error::PROD_NEXT_PUBLIC_ANALYTICS_ENABLED must be configured as true."
            exit 1
          fi
          if ! printf '%s' "$GA_MEASUREMENT_ID" | grep -Eq '^G-[A-Z0-9]+$'; then
            echo "::error::PROD_NEXT_PUBLIC_GA_MEASUREMENT_ID is missing or invalid."
            exit 1
          fi

      - name: Build & push image to ECR (arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/arm64
          # Single-arch manifest (no OCI image index / provenance attestation) so Fargate
          # can pull it — Fargate does not resolve an image index.
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:prod
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
          # Build cache lives in ECR, NOT in GitHub Actions cache — see the same block in
          # deploy-dev-aws.yml for why (`type=gha,mode=max` exhausted the 10 GB quota).
          # A separate tag from dev's so the two environments never evict each other.
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:buildcache-prod
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:buildcache-prod,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          # Prod cookie identity is baked into the Edge middleware at build time. These
          # MUST be the prod values (bakimx_session / .bakimx.com) so the cookie is shared
          # across bakimx.com (login) and app.bakimx.com — and never reuse the dev image,
          # whose cookie name/domain (bakimx_session_dev / app-dev.bakimx.com) are baked in.
          build-args: |
            SESSION_SECRET=build_time_placeholder_at_least_32_chars_long__
            SESSION_COOKIE_NAME=bakimx_session
            SESSION_COOKIE_DOMAIN=.bakimx.com
            NEXT_PUBLIC_ANALYTICS_ENABLED=${{ vars.PROD_NEXT_PUBLIC_ANALYTICS_ENABLED }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.PROD_NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      - name: Register new task definition (swap image)
        id: taskdef
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:sha-${GITHUB_SHA}"
          # Clone the current task def, swap the app image, and inject the runtime env this
          # environment needs but the CDK task def omits:
          #   DB_SSL_NO_VERIFY   — REQUIRED: prod RDS enforces SSL (rds.force_ssl=1) and its
          #                        DATABASE_URL uses sslmode=require; the pg driver would fail
          #                        chain verification against the Amazon RDS CA. This makes
          #                        db.ts strip sslmode and set rejectUnauthorized:false
          #                        (still encrypted, private in-VPC RDS). See src/lib/db.ts.
          #   SESSION_COOKIE_*   — prod cookie identity (bakimx_session / .bakimx.com); the
          #                        Node routes read these at runtime, the Edge middleware got
          #                        them at build time via build-args above. Explicit for parity.
          # Idempotent across re-runs. TODO(cdk-backfill): move these into the CDK task def.
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition --output json \
          | jq --arg IMG "$IMAGE" --arg CN "$CONTAINER_NAME" '
              (.containerDefinitions[] | select(.name==$CN)).image = $IMG
              | (.containerDefinitions[] | select(.name==$CN)).environment |=
                  ((. // [])
                   | map(select(.name != "DB_SSL_NO_VERIFY"
                                and .name != "SESSION_COOKIE_NAME"
                                and .name != "SESSION_COOKIE_DOMAIN"
                                and .name != "GETIRBAKIM_PROVIDER"))
                   + [{name: "DB_SSL_NO_VERIFY",     value: "true"},
                      {name: "SESSION_COOKIE_NAME",   value: "bakimx_session"},
                      {name: "SESSION_COOKIE_DOMAIN", value: ".bakimx.com"},
                      {name: "GETIRBAKIM_PROVIDER",  value: "http"}])
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)
            ' > new-taskdef.json
          NEW_TD=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered: $NEW_TD"
          echo "task_def=$NEW_TD" >> "$GITHUB_OUTPUT"

      - name: DB migration gate (one-off ECS task)
        env:
          NEW_TD: ${{ steps.taskdef.outputs.task_def }}
        run: |
          set -euo pipefail
          # Reuse the service's own subnets/SG so the migrate task reaches the private RDS
          # in-VPC (CI itself cannot). Command override runs the same migrate the app image
          # ships; the new task def carries DB_SSL_NO_VERIFY so migrate connects over TLS too.
          # (A dedicated bakimx-prod-migrate task-def family also exists for manual/CDK use.)
          NET=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          SUBNETS=$(echo "$NET" | jq -r '.subnets | join(",")')
          SGS=$(echo "$NET" | jq -r '.securityGroups | join(",")')
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$NEW_TD" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"'"$CONTAINER_NAME"'","command":["sh","-c","cd /migrate && node node_modules/prisma/build/index.js migrate deploy"]}]}' \
            --started-by "gha-migrate" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migrate task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Migrate exit code: $EXIT (stoppedReason: $REASON)"
          if [ "$EXIT" != "0" ]; then
            echo "::error::DB migration failed (exit=$EXIT) — aborting deploy. Check CloudWatch /ecs/bakimx-prod-app."
            exit 1
          fi

      - name: Stage 2A pilot tenant activation
        env:
          NEW_TD: ${{ steps.taskdef.outputs.task_def }}
        run: |
          set -euo pipefail
          NET=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          SUBNETS=$(echo "$NET" | jq -r '.subnets | join(",")')
          SGS=$(echo "$NET" | jq -r '.securityGroups | join(",")')
          COMMAND='cd /migrate && node node_modules/tsx/dist/cli.mjs scripts/activate-stage2a-pilot.ts'
          OVERRIDES=$(jq -nc --arg command "$COMMAND" '{containerOverrides:[{name:"app",command:["sh","-c",$command]}]}')
          TASK_ARN=$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition "$NEW_TD" --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=DISABLED}" --overrides "$OVERRIDES" --started-by "gha-stage2a-pilot" --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT" = "0"

      - name: Vehicle-catalog seed (one-off ECS task, non-blocking)
        env:
          NEW_TD: ${{ steps.taskdef.outputs.task_def }}
        run: |
          set -euo pipefail
          # Seed the GLOBAL vehicle catalog (vehicle_brands/models/types/type_details) from the
          # committed gz fixtures baked into the image at /migrate/prisma/data/vehicle-catalog.
          # Runs after the migrate gate so the tables exist; idempotent (createMany skipDuplicates),
          # so it is a near-noop once populated. Deliberately NON-BLOCKING: an empty catalog only
          # degrades the brand/model picker to free-text entry, which must never abort a deploy.
          #
          # Task-level cpu/memory are overridden for this one-off run: the service task is sized
          # 512/1024 for a Next.js server, but seeding 37.9k wide type_details rows through Prisma
          # peaks around 1.2 GB (the engine holds memory across createMany calls), and a 512 MB dev
          # task was OOM-killed — "OutOfMemoryError: container killed due to memory usage", exit 137.
          # 512/2048 is a valid Fargate combo and costs ~nothing for a ~3 min task.
          NET=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          SUBNETS=$(echo "$NET" | jq -r '.subnets | join(",")')
          SGS=$(echo "$NET" | jq -r '.securityGroups | join(",")')
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$NEW_TD" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=DISABLED}" \
            --overrides '{"cpu":"512","memory":"2048","containerOverrides":[{"name":"'"$CONTAINER_NAME"'","command":["sh","-c","cd /migrate && node node_modules/tsx/dist/cli.mjs scripts/migrate-vehicle-catalog.ts --from-file"]}]}' \
            --started-by "gha-catalog-seed" \
            --query 'tasks[0].taskArn' --output text)
          echo "Catalog-seed task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          # stoppedReason is the generic task-level message ("Essential container in task exited");
          # the container-level reason is the one that names OOM kills, so print both.
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          CONTAINER_REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].reason' --output text)
          echo "Catalog-seed exit code: $EXIT (stoppedReason: $REASON | container: $CONTAINER_REASON)"
          if [ "$EXIT" != "0" ]; then
            echo "::warning::Vehicle-catalog seed failed (exit=$EXIT, $CONTAINER_REASON) — deploy continues; brand/model picker falls back to free-text. Check CloudWatch /ecs/bakimx-prod-app."
          fi

      - name: Deploy to ECS (update service)
        env:
          NEW_TD: ${{ steps.taskdef.outputs.task_def }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TD" --query 'service.serviceName' --output text
          echo "Waiting for the service to reach steady state…"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          # services-stable also returns success once a circuit-breaker rollback settles on the
          # OLD task def, so assert the PRIMARY deployment actually converged on our new one.
          ACTIVE_TD=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' --output text)
          if [ "$ACTIVE_TD" != "$NEW_TD" ]; then
            echo "::error::Deployment rolled back — active is $ACTIVE_TD, expected $NEW_TD. New task failed its health check (check the ALB target group + CloudWatch /ecs/bakimx-prod-app)."
            exit 1
          fi
          echo "Deployed and verified: $NEW_TD"
