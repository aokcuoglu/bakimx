name: Release

# Bir sürüm tag'i (vX.Y.Z) push edildiğinde otomatik GitHub Release oluşturur.
# Gövdeyi docs/releases/<tag>.md'den alır; yoksa commit'lerden otomatik üretir.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/${TAG}.md"

          if [ -f "$notes_file" ]; then
            echo "Notlar bulundu: $notes_file"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$notes_file" \
              --verify-tag --latest
          else
            echo "Not dosyası yok — commit'lerden otomatik üretiliyor."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag --latest
          fi
