name: Pull request quality

# Runs on PRs AND — via workflow_call — as the gate in front of both deploys.
# The PR's green check only proves the PR *head* was green; it says nothing about
# the merged result. With no branch protection on this plan (private repo + free
# plan → both the branch-protection and rulesets APIs return 403), nothing forces
# a branch to be up to date before merge, and nothing stops a direct push to
# dev/main. So the deploy workflows re-run this against the exact commit they are
# about to ship. See deploy-dev-aws.yml / deploy-prod-aws.yml.
on:
  pull_request:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the PR number for PR runs (a new push supersedes the old run), but on
# run_id everywhere else. Without that fallback every deploy-triggered run on the
# same branch would share one group and cancel the previous deploy's gate — which
# fails that deploy instead of guarding it.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://bakimx:bakimx@127.0.0.1:5432/bakimx
      SESSION_SECRET: ci_only_placeholder_at_least_32_chars_long
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
