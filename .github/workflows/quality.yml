name: Pull request quality

# Runs on PRs AND — via workflow_call — as the gate in front of both deploys.
# The PR's green check only proves the PR *head* was green; it says nothing about
# the merged result. Branch protection is ON since 2026-08-17 (BAK-89), but it only
# closes part of the gap: `main` requires this check and an up-to-date branch,
# while `dev` requires neither (sync-main-to-dev.yml pushes to dev directly, so a
# required check there would break every post-release sync). So a stale branch can
# still be merged into `dev`. That is why the deploy workflows re-run this against
# the exact commit they are about to ship. See deploy-dev-aws.yml /
# deploy-prod-aws.yml and docs/agent-workflows/repo-guardrails.md §2.
#
# Actions quota (local-dev-batch-ci): PRs into `dev` only run this job when the
# PR carries the `ci` label. PRs into `main` always run (required check).
# `labeled` is in types so adding `ci` at end of day starts one batch run;
# synchronize re-runs while the label stays. workflow_call / workflow_dispatch
# are unchanged. See docs/agent-workflows/local-dev-batch-ci.md.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the PR number for PR runs (a new push supersedes the old run), but on
# run_id everywhere else. Without that fallback every deploy-triggered run on the
# same branch would share one group and cancel the previous deploy's gate — which
# fails that deploy instead of guarding it.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    # Skip unlabeled PRs targeting `dev` (0 billable minutes). Never skip
    # `main`, or non-PR callers (deploy gates / manual dispatch).
    if: >
      github.event_name != 'pull_request' ||
      github.base_ref == 'main' ||
      contains(join(github.event.pull_request.labels.*.name, ','), 'ci')
    # Runner from the repository variable CI_RUNS_ON (JSON: a label string or an array). Unset: GitHub-hosted.
    # Since 2026-11-20 it points at the owner's Mac (["self-hosted","macOS","ARM64","bakimx"], #753) because the
    # Actions budget is exhausted. `services:` only works on Linux runners, so Postgres starts in a step below.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      SESSION_SECRET: ci_only_placeholder_at_least_32_chars_long
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Postgres
        # Docker picks a free localhost port, so the owner's local databases are never touched. DATABASE_URL goes
        # through GITHUB_ENV (not job env) so the later steps see the chosen port.
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_KIND" = "self-hosted" ]; then
            docker ps -aq --filter label=bakimx-ci=postgres | while read -r id; do docker rm -f "$id" >/dev/null; done
          fi
          name="bakimx-ci-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CI_PG_CONTAINER=$name" >> "$GITHUB_ENV"
          docker run -d --rm --name "$name" --label bakimx-ci=postgres \
            -e POSTGRES_USER=bakimx -e POSTGRES_PASSWORD=bakimx -e POSTGRES_DB=bakimx \
            -p 127.0.0.1::5432 postgres:16 >/dev/null
          mapping="$(docker port "$name" 5432/tcp | head -n 1)"
          port="${mapping##*:}"
          for _ in $(seq 1 60); do
            if docker exec "$name" pg_isready -h 127.0.0.1 -U bakimx -d bakimx >/dev/null 2>&1; then
              echo "DATABASE_URL=postgresql://bakimx:bakimx@127.0.0.1:${port}/bakimx" >> "$GITHUB_ENV"
              echo "Postgres ready on 127.0.0.1:${port}"
              exit 0
            fi
            sleep 2
          done
          docker logs "$name" | tail -n 30
          exit 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            echo "::warning::bun install failed (attempt ${attempt}/3); clearing package cache before retry"
            bun pm cache rm
          done
          exit 1

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Apply migrations and detect schema drift
        run: |
          bun run db:deploy
          bunx prisma migrate diff \
            --from-config-datasource \
            --to-schema=prisma/schema.prisma \
            --exit-code

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Remove Postgres
        if: always()
        run: |
          if [ -n "${CI_PG_CONTAINER:-}" ]; then docker rm -f "$CI_PG_CONTAINER" >/dev/null 2>&1 || true; fi
