name: Deploy to AWS dev (app-dev.bakimx.com)

# AWS-hosted "dev" environment (app-dev.bakimx.com). Replaced the retired Contabo
# staging.app.bakimx.com (2026-07-20). IAM/OIDC + task-def env spec: docs/deployment/aws-dev.md.
#
# Flow: build arm64 image → push to ECR → register a new task-def revision (image swap)
# → DB migration gate (one-off ECS task, aborts on failure) → update the ECS service.

on:
  push:
    branches: [dev]
    # Docs/markdown-only pushes don't change the image or infra — skip the ~15 min build+deploy.
    # (workflow_dispatch always runs, as a manual override.)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".env*.example"
  workflow_dispatch:

# OIDC: assume the AWS deploy role without long-lived keys.
permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-dev-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 292398627626.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: bakimx/app
  ECS_CLUSTER: bakimx-dev-cluster
  ECS_SERVICE: bakimx-dev-app-svc
  TASK_FAMILY: bakimx-dev-app
  CONTAINER_NAME: app
  ROLE_ARN: arn:aws:iam::292398627626:role/bakimx-dev-gha-deploy

jobs:
  # Quality gate. `quality` otherwise only runs on pull_request, which means a direct
  # push to dev — or a merge whose result nobody revalidated — reached this environment
  # with no test/lint/typecheck/build at all. Branch protection would normally cover
  # that, but it is unavailable on this plan (private repo + free plan → the
  # branch-protection and rulesets APIs both 403), so the gate lives here instead.
  # It runs against the exact commit about to be deployed, not a PR head.
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    # Native ARM64 runner → Fargate task runtimePlatform is ARM64 (Graviton), so the image
    # must be arm64. Native build avoids QEMU emulation. If arm64 hosted runners are not
    # available on your GitHub plan, switch to `ubuntu-latest` and add
    # `docker/setup-qemu-action@v3` (build-push-action already targets platforms: linux/arm64).
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build & push image to ECR (arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/arm64
          # Single-arch manifest (no OCI image index / provenance attestation) so Fargate
          # can pull it — Fargate does not resolve an image index.
          provenance: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:dev
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
          # Build cache lives in ECR, NOT in GitHub Actions cache. `type=gha,mode=max`
          # writes every intermediate layer as its own cache entry and the GHA backend
          # never garbage-collects them — it filled the repo's 10 GB quota in ~6 weeks
          # and then started LRU-evicting layers the next build still needed.
          # ECR has no such quota, and `image-manifest=true` + `oci-mediatypes=true` are
          # required for ECR to accept the cache manifest at all.
          # `ignore-error=true`: a cache export hiccup must never fail a deploy.
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:buildcache-dev
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:buildcache-dev,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          build-args: |
            SESSION_SECRET=build_time_placeholder_at_least_32_chars_long__
            SESSION_COOKIE_NAME=bakimx_session_dev
            SESSION_COOKIE_DOMAIN=app-dev.bakimx.com

      - name: Register new task definition (swap image)
        id: taskdef
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:sha-${GITHUB_SHA}"
          # Clone the current task def, swap only the app container image, drop read-only fields.
          # Clone the current task def, swap the app image, and inject the runtime env this
          # environment needs but the CDK task def omits:
          #   DB_SSL_NO_VERIFY   — app pg driver must skip RDS CA verification (src/lib/db.ts)
          #   SESSION_COOKIE_*   — isolate app-dev's session cookie from prod's .bakimx.com
          #                        cookie (the Node routes read these at runtime; the Edge
          #                        middleware gets them at build time via build-args above)
          # Idempotent across re-runs. TODO(cdk-backfill): move these into the CDK task def.
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition --output json \
          | jq --arg IMG "$IMAGE" --arg CN "$CONTAINER_NAME" '
              (.containerDefinitions[] | select(.name==$CN)).image = $IMG
              | (.containerDefinitions[] | select(.name==$CN)).environment |=
                  ((. // [])
                   | map(select(.name != "DB_SSL_NO_VERIFY"
                                and .name != "SESSION_COOKIE_NAME"
                                and .name != "SESSION_COOKIE_DOMAIN"))
                   + [{name: "DB_SSL_NO_VERIFY",     value: "true"},
                      {name: "SESSION_COOKIE_NAME",   value: "bakimx_session_dev"},
                      {name: "SESSION_COOKIE_DOMAIN", value: "app-dev.bakimx.com"}])
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)
            ' > new-taskdef.json
          NEW_TD=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered: $NEW_TD"
          echo "task_def=$NEW_TD" >> "$GITHUB_OUTPUT"

      - name: DB migration gate (one-off ECS task)
        env:
          NEW_TD: ${{ steps.taskdef.outputs.task_def }}
        run: |
          set -euo pipefail
          # Reuse the service's own subnets/SG so the migrate task reaches the private RDS
          # in-VPC (CI itself cannot). Command override runs the same migrate the Contabo
          # prod compose stack runs; the entrypoint execs it (static-chunk step is app-start only).
          NET=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          SUBNETS=$(echo "$NET" | jq -r '.subnets | join(",")')
          SGS=$(echo "$NET" | jq -r '.securityGroups | join(",")')
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$NEW_TD" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"'"$CONTAINER_NAME"'","command":["sh","-c","cd /migrate && node node_modules/prisma/build/index.js migrate deploy"]}]}' \
            --started-by "gha-migrate" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migrate task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Migrate exit code: $EXIT (stoppedReason: $REASON)"
          if [ "$EXIT" != "0" ]; then
            echo "::error::DB migration failed (exit=$EXIT) — aborting deploy. Check CloudWatch /ecs/bakimx-dev-app."
            exit 1
          fi

      - name: Vehicle-catalog seed (one-off ECS task, non-blocking)
        env:
          NEW_TD: ${{ steps.taskdef.outputs.task_def }}
        run: |
          set -euo pipefail
          # Seed the GLOBAL vehicle catalog (vehicle_brands/models/types/type_details) from the
          # committed gz fixtures baked into the image at /migrate/prisma/data/vehicle-catalog.
          # Runs after the migrate gate so the tables exist; idempotent (createMany skipDuplicates),
          # so it is a near-noop once populated. Deliberately NON-BLOCKING: an empty catalog only
          # degrades the brand/model picker to free-text entry, which must never abort a deploy.
          #
          # Task-level cpu/memory are overridden for this one-off run: the service task is sized
          # 256/512 for a Next.js server, but seeding 37.9k wide type_details rows through Prisma
          # peaks around 1.2 GB (the engine holds memory across createMany calls), and a 512 MB
          # task was OOM-killed — "OutOfMemoryError: container killed due to memory usage", exit 137.
          # 512/2048 is a valid Fargate combo and costs ~nothing for a ~3 min task.
          NET=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          SUBNETS=$(echo "$NET" | jq -r '.subnets | join(",")')
          SGS=$(echo "$NET" | jq -r '.securityGroups | join(",")')
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$NEW_TD" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=DISABLED}" \
            --overrides '{"cpu":"512","memory":"2048","containerOverrides":[{"name":"'"$CONTAINER_NAME"'","command":["sh","-c","cd /migrate && node node_modules/tsx/dist/cli.mjs scripts/migrate-vehicle-catalog.ts --from-file"]}]}' \
            --started-by "gha-catalog-seed" \
            --query 'tasks[0].taskArn' --output text)
          echo "Catalog-seed task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          # stoppedReason is the generic task-level message ("Essential container in task exited");
          # the container-level reason is the one that names OOM kills, so print both.
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          CONTAINER_REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].reason' --output text)
          echo "Catalog-seed exit code: $EXIT (stoppedReason: $REASON | container: $CONTAINER_REASON)"
          if [ "$EXIT" != "0" ]; then
            echo "::warning::Vehicle-catalog seed failed (exit=$EXIT, $CONTAINER_REASON) — deploy continues; brand/model picker falls back to free-text. Check CloudWatch /ecs/bakimx-dev-app."
          fi

      - name: Deploy to ECS (update service)
        env:
          NEW_TD: ${{ steps.taskdef.outputs.task_def }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TD" --query 'service.serviceName' --output text
          echo "Waiting for the service to reach steady state…"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          # services-stable also returns success once a circuit-breaker rollback settles on the
          # OLD task def, so assert the PRIMARY deployment actually converged on our new one.
          ACTIVE_TD=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' --output text)
          if [ "$ACTIVE_TD" != "$NEW_TD" ]; then
            echo "::error::Deployment rolled back — active is $ACTIVE_TD, expected $NEW_TD. New task failed its health check (check the ALB target group + CloudWatch /ecs/bakimx-dev-app)."
            exit 1
          fi
          echo "Deployed and verified: $NEW_TD"
